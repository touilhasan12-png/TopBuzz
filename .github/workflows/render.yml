name: Render TopBuzz 2D Master Episode

on:
  workflow_dispatch:

jobs:
  render-master:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TopBuzz Engine
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(node -e "import('ffmpeg-static').then(m=>process.stdout.write(m.default))")" "$HOME/.local/bin/ffmpeg"
          ln -sf "$(node -e "import('@ffprobe-installer/ffprobe').then(m=>process.stdout.write(m.path))")" "$HOME/.local/bin/ffprobe"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render All 2,232 Full-HD (1080x1920 @ 30fps) Frames Across 4 Workers
        run: |
          node render.mjs --frames --fps=30 --workers=4

      - name: Encode H.264 High Profile + -14.0 LUFS Broadcast Audio
        run: |
          node render.mjs --encode --fps=30 --out=out/TopBuzz_EP01_Hybrid_V2_1080p_Master.mp4
          rm -rf out/frames

      - name: Upload Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: topbuzz-ep01-hybrid-v2-master
          path: out/TopBuzz_EP01_Hybrid_V2_1080p_Master.mp4
          if-no-files-found: error
