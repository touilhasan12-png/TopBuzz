name: Render Richard Bong epic short

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  render:
    name: Build 84-second narrated portrait video
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip xvfb libgl1-mesa-dri

      - name: Download Godot 4.4.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Validate project scripts and scene
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path ENGINE_SOURCE --quit

      - name: Render 2D animation
        run: |
          mkdir -p output
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1920x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
            --path ENGINE_SOURCE \
            --write-movie "$GITHUB_WORKSPACE/output/richard-bong-silent.avi" \
            --fixed-fps 30 \
            --resolution 720x1280 \
            --quit-after 2520
          test -s output/richard-bong-silent.avi

      - name: Join English narration and mux final MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i ENGINE_SOURCE/audio/narration_01.mp3 \
            -i ENGINE_SOURCE/audio/narration_02.mp3 \
            -i ENGINE_SOURCE/audio/narration_03.mp3 \
            -i ENGINE_SOURCE/audio/narration_04.mp3 \
            -filter_complex "\
              [0:a]aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo[a0];\
              [1:a]aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo[a1];\
              [2:a]aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo[a2];\
              [3:a]aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo[a3];\
              [a0][a1][a2][a3]concat=n=4:v=0:a=1[voice]" \
            -map "[voice]" -c:a aac -b:a 128k output/narration.m4a

          ffmpeg -hide_banner -loglevel error -y \
            -i output/richard-bong-silent.avi \
            -i output/narration.m4a \
            -filter_complex "[1:a]apad,atrim=duration=84,asetpts=PTS-STARTPTS[a]" \
            -map 0:v:0 -map "[a]" \
            -t 84 -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart \
            output/richard-bong-ace-of-aces.mp4

      - name: Verify video and audio streams
        run: |
          test -s output/richard-bong-ace-of-aces.mp4
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/richard-bong-ace-of-aces.mp4)
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/richard-bong-ace-of-aces.mp4)
          fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 output/richard-bong-ace-of-aces.mp4)
          audio_codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/richard-bong-ace-of-aces.mp4)
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/richard-bong-ace-of-aces.mp4)
          echo "Video: ${width}x${height} at ${fps}; audio: ${audio_codec}; duration: ${duration}s"
          test "$width" = "720"
          test "$height" = "1280"
          test "$fps" = "30/1"
          test "$audio_codec" = "aac"
          python3 -c 'import sys; d=float(sys.argv[1]); sys.exit(0 if 83.5 <= d <= 84.5 else 1)' "$duration"

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: richard-bong-ace-of-aces-84s
          path: output/richard-bong-ace-of-aces.mp4
          if-no-files-found: error
          retention-days: 7
