name: 01 — Asset hunt (licensed archival media + data + fonts)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: fetch everything
        run: python scripts/fetch_assets.py --out assets_out
      - name: footage v2 (photos + throttle-safe video + IA fix)
        run: python scripts/fetch_footage_v2.py --out assets_out
      - name: zip
        run: cd assets_out && zip -qr ../assets_bundle.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets_out
          retention-days: 30
      - name: publish to pipeline release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pipeline-latest
          name: pipeline-latest
          files: assets_bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
