name: Hamilton five-second layered proof

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  pilot-proof:
    name: Render five-second Hamilton cut-out preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip xvfb libgl1-mesa-dri

      - name: Download Godot 4.4.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Import proof project and validate scripts
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path ENGINE_SOURCE/prototype_hamilton --quit

      - name: Render five-second proof on GitHub
        run: |
          mkdir -p output
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1920x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
            --path ENGINE_SOURCE/prototype_hamilton \
            --write-movie "$GITHUB_WORKSPACE/output/hamilton-proof.avi" \
            --fixed-fps 30 \
            --resolution 720x1280 \
            --quit-after 150
          test -s output/hamilton-proof.avi

      - name: Encode and verify proof MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/hamilton-proof.avi \
            -frames:v 150 -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -movflags +faststart output/hamilton-pilot-proof-5s.mp4
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/hamilton-pilot-proof-5s.mp4)
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/hamilton-pilot-proof-5s.mp4)
          fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 output/hamilton-pilot-proof-5s.mp4)
          frames=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 output/hamilton-pilot-proof-5s.mp4)
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/hamilton-pilot-proof-5s.mp4)
          echo "${width}x${height} ${fps} ${frames} frames ${duration}s"
          test "$width" = "720"
          test "$height" = "1280"
          test "$fps" = "30/1"
          test "$frames" = "150"
          python3 -c 'import sys; d=float(sys.argv[1]); sys.exit(0 if 4.9 <= d <= 5.1 else 1)' "$duration"

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-pilot-proof-5s
          path: output/hamilton-pilot-proof-5s.mp4
          if-no-files-found: error
          retention-days: 7
