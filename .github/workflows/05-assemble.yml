name: 05-assemble
on:
  workflow_dispatch:
    inputs:
      render_run_id:
        description: "Actions run ID of 04-full-render to pull parts from"
        required: true
        default: "39672533243"
      music:
        description: "Mix music bed under voice"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all parts (cross-run)
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.render_run_id }}
      - name: Verify parts
        run: |
          ls -l parts/ && ls -l parts/part-1/ && echo PART_COUNT=$(ls -d parts/part-* | wc -l)
      - name: Install ffmpeg
        run: |
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          /tmp/ff/ffmpeg -version | head -1
      - name: Fetch audio from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p audio
          for N in vo_full.mp3 the_descent.mp3; do
            URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/pipeline-latest | python3 -c "import json,sys; r=json.load(sys.stdin); print(next((a['url'] for a in r['assets'] if a['name']=='$N'), ''))")
            if [ -n "$URL" ]; then
              curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$URL" -o "audio/$N"
            fi
          done
          ls -l audio/
      - name: Concat video parts
        run: |
          rm -f list.txt
          for i in $(seq 1 12); do
            echo "file 'parts/part-$i/part.mp4'" >> list.txt
          done
          cat list.txt
          /tmp/ff/ffmpeg -y -f concat -safe 0 -c copy -i list.txt video_full.mp4
          /tmp/ff/ffprobe -v error -show_entries format=duration -of csv=p=0 video_full.mp4
      - name: Mix audio (VO + ducked music) and mux
        run: |
          if [ "${{ github.event.inputs.music }}" = "true" ] && [ -f audio/the_descent.mp3 ]; then
            /tmp/ff/ffmpeg -y -i audio/vo_full.mp3 -stream_loop -1 -i audio/the_descent.mp3 \
              -filter_complex "[1:a]atrim=0:1172,volume=0.34,afade=t=in:st=0:d=3,afade=t=out:st=1160:d=12[m];[0:a][m]sidechaincompress=threshold=0.02:ratio=8:attack=30:release=500:makeup=1.3[a]" \
              -map "[a]" -ar 48000 -ac 1 mixed.wav
          else
            /tmp/ff/ffmpeg -y -i audio/vo_full.mp3 -ar 48000 -ac 1 mixed.wav
          fi
          /tmp/ff/ffmpeg -y -i video_full.mp4 -i mixed.wav \
            -map 0:v -map 1:a -c:v copy -af loudnorm=I=-14:TP=-1:LRA=9 -c:a aac -b:a 192k \
            -shortest hormuz_final.mp4
      - name: Final probe
        run: |
          /tmp/ff/ffprobe -v error -show_format -select_streams v:0 -show_streams hormuz_final.mp4 | grep -E "duration|width|height|codec_name"
      - uses: actions/upload-artifact@v4
        with:
          name: hormuz_final
          path: hormuz_final.mp4
          retention-days: 30
      - name: Upload final to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/pipeline-latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: video/mp4" \
            --data-binary @hormuz_final.mp4 \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=hormuz_final.mp4" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("release asset:", d.get("name"), d.get("size"))'
