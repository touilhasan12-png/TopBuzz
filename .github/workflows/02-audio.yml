name: 02 — Voice & sound (Kokoro am_adam + aeneas + SRT + mix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: python deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" soundfile pydub kokoro "misaki[en]" aeneas
      - name: music + sfx from assets release (best-effort) else fetch inline
        run: |
          python scripts/fetch_assets.py --out assets_out --only music,sfx
      - name: voice build (verbatim)
        run: python scripts/build_voice.py
      - name: word alignment
        run: python scripts/align_words.py
      - name: srt + chapters
        run: python scripts/make_srt.py
      - name: final mix
        run: python scripts/mix_audio.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: |
            vo_full.wav
            mix_final.wav
            mix_final.mp3
            cold_open_preview.mp3
            segments.json
            alignment.json
            captions.srt
            chapters.txt
            tts_notes.json
          retention-days: 30
      - name: zip + release
        run: zip -q audio_bundle.zip vo_full.wav mix_final.wav mix_final.mp3 cold_open_preview.mp3 segments.json alignment.json captions.srt chapters.txt tts_notes.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pipeline-latest
          name: pipeline-latest
          files: audio_bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
